  bio_subtitle: PhD Student at EPFL
  bio_intro: I am a PhD student in the AMCV group at EPFL, supervised by Prof. Maria Colombo (EPFL) and Prof. Dallas Albritton (University of Wisconsin–Madison).
  bio_education: Previously, I completed an MSc in Computational Science and Engineering through a double-degree programme between EPFL and Politecnico di Milano, as well as a BSc in Mathematical Engineering.
  bio_research: My research lies in the field of partial differential equations, with a particular focus on instability and non-uniqueness phenomena arising in fluid dynamics models.
