  bio_education: Auparavant, j’ai obtenu un master en sciences et ingénierie computationnelles dans le cadre d’un programme de double diplôme entre l’EPFL et le Politecnico di Milano, ainsi qu’un bachelor en ingénierie mathématique.
  bio_research: Mes recherches portent sur les équations aux dérivées partielles, avec un intérêt particulier pour les phénomènes d’instabilité et de non-unicité dans les modèles de dynamique des fluides.
